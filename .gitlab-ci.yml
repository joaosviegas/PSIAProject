stages:
  - test
  - build
  - e2e
  - deploy

variables:
  GIT_SSL_NO_VERIFY: "true"
  GIT_DEPTH: "0"
  GIT_STRATEGY: clone     # Ensures clean workspace per job
  # /builds is shared with the runner host (so compose bind mounts resolve); one checkout
  # per concurrent slot so parallel jobs don't clone over each other.
  GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_CONCURRENT_ID/$CI_PROJECT_PATH

# Separate cache per job to prevent concurrent write corruption
.maven-cache: &maven-cache
  cache:
    key: "maven-$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository

# ── Stage 1: test (all services) ──────────────────────────────────────────

test:auth-service:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  <<: *maven-cache
  script:
    - mvn -f services/auth-service/pom.xml test -Dmaven.repo.local=.m2/repository
  artifacts:
    when: always
    reports:
      junit: services/auth-service/target/surefire-reports/TEST-*.xml

test:profile-service:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  <<: *maven-cache
  script:
    - mvn -f services/profile-service/pom.xml test -Dmaven.repo.local=.m2/repository
  artifacts:
    when: always
    reports:
      junit: services/profile-service/target/surefire-reports/TEST-*.xml

test:recommendation-service:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  <<: *maven-cache
  script:
    - mvn -f services/recommendation-service/pom.xml test -Dmaven.repo.local=.m2/repository
  artifacts:
    when: always
    reports:
      junit: services/recommendation-service/target/surefire-reports/TEST-*.xml

test:agent-service:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  <<: *maven-cache
  script:
    - mvn -f services/agent-service/pom.xml test -Dmaven.repo.local=.m2/repository
  artifacts:
    when: always
    reports:
      junit: services/agent-service/target/surefire-reports/TEST-*.xml

# ── Stage 2: build + push all Docker images ───────────────────────────────

.build-image: &build-image
  stage: build
  image: docker:24
  variables:
    DOCKER_BUILDKIT: "1"  # Enables parallel layer caching & faster builds on shared socket
  before_script:
    - echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USER" --password-stdin

build:auth-service:
  <<: *build-image
  script:
    - docker build -t $DOCKER_HUB_USER/g37-auth-service:$CI_COMMIT_SHORT_SHA services/auth-service
    - docker push $DOCKER_HUB_USER/g37-auth-service:$CI_COMMIT_SHORT_SHA
    - docker tag $DOCKER_HUB_USER/g37-auth-service:$CI_COMMIT_SHORT_SHA $DOCKER_HUB_USER/g37-auth-service:latest
    - docker push $DOCKER_HUB_USER/g37-auth-service:latest

build:profile-service:
  <<: *build-image
  script:
    - docker build -t $DOCKER_HUB_USER/g37-profile-service:$CI_COMMIT_SHORT_SHA services/profile-service
    - docker push $DOCKER_HUB_USER/g37-profile-service:$CI_COMMIT_SHORT_SHA
    - docker tag $DOCKER_HUB_USER/g37-profile-service:$CI_COMMIT_SHORT_SHA $DOCKER_HUB_USER/g37-profile-service:latest
    - docker push $DOCKER_HUB_USER/g37-profile-service:latest

build:recommendation-service:
  <<: *build-image
  script:
    - docker build -t $DOCKER_HUB_USER/g37-recommendation-service:$CI_COMMIT_SHORT_SHA services/recommendation-service
    - docker push $DOCKER_HUB_USER/g37-recommendation-service:$CI_COMMIT_SHORT_SHA
    - docker tag $DOCKER_HUB_USER/g37-recommendation-service:$CI_COMMIT_SHORT_SHA $DOCKER_HUB_USER/g37-recommendation-service:latest
    - docker push $DOCKER_HUB_USER/g37-recommendation-service:latest

build:agent-service:
  <<: *build-image
  script:
    - docker build -t $DOCKER_HUB_USER/g37-agent-service:$CI_COMMIT_SHORT_SHA services/agent-service
    - docker push $DOCKER_HUB_USER/g37-agent-service:$CI_COMMIT_SHORT_SHA
    - docker tag $DOCKER_HUB_USER/g37-agent-service:$CI_COMMIT_SHORT_SHA $DOCKER_HUB_USER/g37-agent-service:latest
    - docker push $DOCKER_HUB_USER/g37-agent-service:latest

build:gateway:
  <<: *build-image
  script:
    - docker build -t $DOCKER_HUB_USER/g37-gateway:$CI_COMMIT_SHORT_SHA frontend
    - docker push $DOCKER_HUB_USER/g37-gateway:$CI_COMMIT_SHORT_SHA
    - docker tag $DOCKER_HUB_USER/g37-gateway:$CI_COMMIT_SHORT_SHA $DOCKER_HUB_USER/g37-gateway:latest
    - docker push $DOCKER_HUB_USER/g37-gateway:latest

# ── Stage 3: Playwright E2E tests ─────────────────────────────────────────

e2e_tests:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.64.0-jammy
  variables:
    BASE_URL: "http://localhost:8080"
  before_script:
    - apt-get update && apt-get install -y docker.io docker-compose-v2 curl
    - cp .env.example .env
    - docker compose up -d --build --wait postgres redis auth-service profile-service recommendation-service agent-service gateway
    # Fetch Docker host IP to route to published host port 8080
    - DOCKER_HOST_IP=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')
    - export BASE_URL="http://${DOCKER_HOST_IP}:8080"
    - echo "Waiting for Gateway at ${BASE_URL}..."
    - timeout 90s sh -c "until curl -fsS ${BASE_URL}/ > /dev/null 2>&1; do sleep 2; done"
    - cd frontend
    - npm ci
  script:
    - npx playwright test
  # The stack runs on the runner VM's own Docker daemon, so tear it down or the next run
  # hits leftover containers and busy ports (8080, 5432).
  after_script:
    - if [ "$CI_JOB_STATUS" != "success" ]; then docker compose ps -a; docker compose logs --tail=80 postgres auth-service profile-service recommendation-service agent-service; fi
    - docker compose down -v --remove-orphans
  artifacts:
    when: always
    paths:
      - frontend/playwright-report/
      - frontend/test-results/
    expire_in: 7 days

# ── Stage 4: deploy ────────────────────────────────────────────────────────

deploy:k8s:
  stage: deploy
  image: alpine:latest
  # Rolls the images built in this pipeline (tagged with the commit SHA) out to the cluster.
  # Manifest changes (env vars, new services) still go through gcpcloud/ansible-deploy-app.yml.
  # Needs CI variables K8S_SSH_KEY (private key, base64 -w0 so it can be masked) and K8S_MASTER_IP;
  # unset K8S_MASTER_IP while the cluster VMs are down and this job is skipped.
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $K8S_MASTER_IP'
  before_script:
    - apk add --no-cache openssh-client
    - echo "$K8S_SSH_KEY" | base64 -d > ~/id_rsa && chmod 600 ~/id_rsa
  script:
    - |
      ssh -i ~/id_rsa -o StrictHostKeyChecking=no ubuntu@$K8S_MASTER_IP "
        set -e
        for svc in auth-service profile-service recommendation-service agent-service gateway; do
          sudo kubectl set image deployment/\$svc \$svc=$DOCKER_HUB_USER/g37-\$svc:$CI_COMMIT_SHORT_SHA
        done
        for svc in auth-service profile-service recommendation-service agent-service gateway; do
          sudo kubectl rollout status deployment/\$svc --timeout=300s
        done"
