# recommendation-service: movie search/browse + "Ask AI" recommendations via Ollama.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation-service
  template:
    metadata:
      labels:
        app: recommendation-service
    spec:
      containers:
        - name: recommendation-service
          image: DOCKER_HUB_USER/g37-recommendation-service:latest
          imagePullPolicy: Always
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-movies:5432/movies
            - name: SPRING_DATASOURCE_USERNAME
              value: movies_svc
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: g37-secrets
                  key: MOVIES_DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: g37-secrets
                  key: JWT_SECRET
            - name: PROFILE_URL
              value: http://profile-service:8080
            - name: LLM_BASE_URL
              value: http://ollama:11434
            - name: LLM_MODEL
              value: qwen2.5:1.5b
          ports:
            - containerPort: 8080
          # Keeps the old pod serving during a rolling deploy until Spring is actually up.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-service
spec:
  selector:
    app: recommendation-service
  ports:
    - port: 8080
