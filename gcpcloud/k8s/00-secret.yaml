# All passwords and secrets in one place.
# Edit the values here before running kubectl apply.
# In compose these come from .env; in K8s they come from this Secret,
# which is mounted as env vars in each pod that needs them.
apiVersion: v1
kind: Secret
metadata:
  name: g37-secrets
type: Opaque
stringData:
  AUTH_DB_PASSWORD: "change_me_auth"
  PROFILE_DB_PASSWORD: "change_me_profile"
  MOVIES_DB_PASSWORD: "change_me_movies"
  JWT_SECRET: "change_me_this_must_be_at_least_32_chars_long"
  GRAFANA_ADMIN_PASSWORD: "change_me_grafana"
