# agent-service: background feed builder, periodically asks Ollama for per-user movie picks
# and caches them in Redis.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-service
  template:
    metadata:
      labels:
        app: agent-service
    spec:
      containers:
        - name: agent-service
          image: DOCKER_HUB_USER/g37-agent-service:latest
          imagePullPolicy: Always
          env:
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: g37-secrets
                  key: JWT_SECRET
            - name: PROFILE_URL
              value: http://profile-service:8080
            - name: RECOMMENDATION_URL
              value: http://recommendation-service:8080
            - name: LLM_BASE_URL
              value: http://ollama:11434
            - name: LLM_MODEL
              value: qwen2.5:1.5b
          ports:
            - containerPort: 8080
          # Keeps the old pod serving during a rolling deploy until Spring is actually up.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agent-service
spec:
  selector:
    app: agent-service
  ports:
    - port: 8080
