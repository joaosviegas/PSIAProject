# Postgres: hostPath volume + single-instance Deployment + ClusterIP Service.
#
# Differs from compose:
# - The init script (infra/postgres/init/01-create-databases.sh) is inlined here
#   as a ConfigMap and mounted at /docker-entrypoint-initdb.d with the same effect.
# - Passwords come from the Secret (00-secret.yaml) instead of .env.
# - hostPath instead of a PVC: bare kubeadm on GCE has no dynamic storage provisioner
#   (that's a GKE-only feature), so PVCs stay Pending forever.
#   hostPath writes to /data/postgres on worker1. The pod is pinned to worker1 with
#   nodeName so data survives pod restarts.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  01-create-databases.sh: |
    #!/bin/bash
    set -euo pipefail
    create_service_db() {
      local db="$1" role="$2" password="$3"
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
           -v db="$db" -v role="$role" -v pw="$password" <<'EOSQL'
    CREATE ROLE :"role" LOGIN PASSWORD :'pw';
    CREATE DATABASE :"db" OWNER :"role";
    REVOKE ALL ON DATABASE :"db" FROM PUBLIC;
    GRANT CONNECT ON DATABASE :"db" TO :"role";
    EOSQL
    }
    create_service_db auth    auth_svc    "${AUTH_DB_PASSWORD}"
    create_service_db profile profile_svc "${PROFILE_DB_PASSWORD}"
    create_service_db movies  movies_svc  "${MOVIES_DB_PASSWORD}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeName: worker1
      containers:
        - name: postgres
          image: postgres:17
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: g37-secrets
                  key: POSTGRES_ADMIN_PASSWORD
            - name: AUTH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: g37-secrets
                  key: AUTH_DB_PASSWORD
            - name: PROFILE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: g37-secrets
                  key: PROFILE_DB_PASSWORD
            - name: MOVIES_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: g37-secrets
                  key: MOVIES_DB_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          hostPath:
            path: /data/postgres
            type: DirectoryOrCreate
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
