# Postgres: one server per service (auth, profile, movies), each a hostPath volume +
# single-instance Deployment + ClusterIP Service.
#
# Differs from compose:
# - Passwords come from the Secret (00-secret.yaml) instead of .env.
# - hostPath instead of a PVC: bare kubeadm on GCE has no dynamic storage provisioner
#   (that's a GKE-only feature), so PVCs stay Pending forever.
#   hostPath writes to /data/postgres-<db> on worker1. The pods are pinned to worker1 with
#   nodeName so data survives pod restarts.
# - postgres-exporter runs as a sidecar, so Prometheus scrapes postgres-<db>:9187 (same as compose).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-auth
spec:
  replicas: 1
  strategy:
    type: Recreate  # two pods must never share the same data directory
  selector:
    matchLabels:
      app: postgres-auth
  template:
    metadata:
      labels:
        app: postgres-auth
    spec:
      nodeName: worker1
      containers:
        - name: postgres
          image: postgres:17
          env:
            - name: POSTGRES_DB
              value: auth
            - name: POSTGRES_USER
              value: auth_svc
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: g37-secrets
                  key: AUTH_DB_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
        - name: exporter
          image: prometheuscommunity/postgres-exporter:latest
          env:
            - name: DATA_SOURCE_URI
              value: localhost:5432/auth?sslmode=disable
            - name: DATA_SOURCE_USER
              value: auth_svc
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: g37-secrets
                  key: AUTH_DB_PASSWORD
          ports:
            - containerPort: 9187
      volumes:
        - name: data
          hostPath:
            path: /data/postgres-auth
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-auth
spec:
  selector:
    app: postgres-auth
  ports:
    - name: postgres
      port: 5432
    - name: metrics
      port: 9187
---
