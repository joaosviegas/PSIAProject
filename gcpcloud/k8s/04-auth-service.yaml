# auth-service: handles registration and login, issues JWTs.
#
# Differs from compose: image pulled from Docker Hub instead of built locally.
# DOCKER_HUB_USER is replaced by ansible-deploy-app.yml (-e docker_hub_user=<you>).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: DOCKER_HUB_USER/g37-auth-service:latest
          imagePullPolicy: Always
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-auth:5432/auth
            - name: SPRING_DATASOURCE_USERNAME
              value: auth_svc
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: g37-secrets
                  key: AUTH_DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: g37-secrets
                  key: JWT_SECRET
          ports:
            - containerPort: 8080
          # Keeps the old pod serving during a rolling deploy until Spring is actually up.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - port: 8080
