---
# Deploy the g37 application on the Kubernetes cluster.
# Copies all manifests from gcpcloud/k8s/ to the master and applies them.
# Run after ansible-workers-join.yml.
- hosts: master
  become: yes
  become_user: root
  become_method: sudo

  tasks:
    - name: Require the Docker Hub user that owns the images
      assert:
        that: docker_hub_user | default('') | length > 0
        fail_msg: "Run with -e docker_hub_user=<your Docker Hub username>"

    - name: Copy all K8s manifests to master
      copy:
        src: k8s/
        dest: /home/ubuntu/k8s/
        mode: 0644

    - name: Point the manifests at your Docker Hub images
      shell: sed -i 's|DOCKER_HUB_USER/|{{ docker_hub_user }}/|' /home/ubuntu/k8s/*.yaml

    - name: Copy monitoring config (shared with compose) to master
      copy:
        src: ../infra/monitoring/
        dest: /home/ubuntu/monitoring/
        mode: 0644

    # Built from the files instead of inlined in a manifest, so there is one copy of each.
    # Keys are renamed because two of the files are both called prometheus.yml.
    - name: Create/update the monitoring-config ConfigMap
      shell: |
        kubectl create configmap monitoring-config \
          --from-file=prometheus.yml=/home/ubuntu/monitoring/prometheus/prometheus.yml \
          --from-file=datasource.yml=/home/ubuntu/monitoring/grafana/provisioning/datasources/prometheus.yml \
          --from-file=dashboards.yml=/home/ubuntu/monitoring/grafana/provisioning/dashboards/dashboards.yml \
          --from-file=psia.json=/home/ubuntu/monitoring/grafana/dashboards/psia.json \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Apply all manifests
      shell: kubectl apply -f /home/ubuntu/k8s/

    - name: Show pod status
      shell: kubectl get pods -n default
      register: pods
      changed_when: false

    - debug:
        msg: "{{ pods.stdout }}"
