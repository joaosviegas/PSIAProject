---
# Initialise the Kubernetes control plane on the master node.
# Installs Calico for pod networking and saves the worker join command locally.
- hosts: master
  become: yes
  become_user: root
  become_method: sudo

  tasks:
    - name: Initialise the cluster
      shell: sudo kubeadm reset --force && sudo kubeadm init --pod-network-cidr=10.244.0.0/16 --ignore-preflight-errors=NumCPU && touch /root/cluster_initialized.txt
      args:
        chdir: /root
        creates: /root/cluster_initialized.txt  # skip if already done

    - name: Create .kube directory for root
      file:
        path: /root/.kube
        state: directory
        mode: 0755

    - name: Copy admin kubeconfig so kubectl works as root
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: yes

    - name: Install Calico network plugin
      shell: kubectl apply -f https://docs.projectcalico.org/manifests/calico.yaml
      args:
        chdir: /root

    - name: Generate the worker join command
      shell: kubeadm token create --print-join-command
      register: kubernetes_join_command

    - debug:
        msg: "{{ kubernetes_join_command.stdout }}"

    - name: Save join command to mgmt node for the next playbook
      become: yes
      local_action: copy content="{{ kubernetes_join_command.stdout_lines[0] }}" dest="/tmp/kubernetes_join_command" mode=0777
