---
# Join the three worker nodes to the cluster.
# Requires ansible-create-cluster.yml to have run first (it writes /tmp/kubernetes_join_command).
- hosts: workers
  become: yes
  gather_facts: yes

  tasks:
    - name: Copy the join command from mgmt to each worker
      copy:
        src: /tmp/kubernetes_join_command
        dest: /tmp/kubernetes_join_command
        mode: 0777

    - name: Join this worker to the cluster
      command: sh /tmp/kubernetes_join_command
      register: joined_or_not

    - debug:
        msg: "{{ joined_or_not.stdout }}"
