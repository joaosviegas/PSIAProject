# PSIA Movie Recommendation Hub - local environment
#
#   cp .env.example .env      # then edit the values
#   just start                # = docker compose up -d --build
#
# Only the gateway publishes a port on the host (http://localhost:8080).
# Service names below are also the DNS names services use to reach each other.

name: psia

# Settings shared by the four Spring Boot services.
x-java-service: &java-service
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
    interval: 10s
    timeout: 3s
    retries: 30
    start_period: 40s

# Settings shared by the three Postgres servers.
x-postgres: &postgres
  image: postgres:17          # keep 17: the 18 image changed its data path and ignores this volume mount
  restart: unless-stopped
  # -h 127.0.0.1 matters: during first-time init the server only listens on a
  # unix socket, so a TCP check does not report "ready" before init has finished.
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 5s
    timeout: 3s
    retries: 30

# Exporter shares its Postgres server's network (like a k8s sidecar), so Prometheus
# scrapes postgres-<svc>:9187 in both compose and Kubernetes.
x-postgres-exporter: &postgres-exporter
  image: prometheuscommunity/postgres-exporter:latest
  restart: unless-stopped

services:

  # ---------- Entry point: nginx serving the Vue build + reverse proxy for /api/* ----------
  gateway:
    build: ./frontend
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    environment:
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"          # exposes $NGINX_LOCAL_RESOLVERS to the template
      AUTH_UPSTREAM: auth-service:8080
      PROFILE_UPSTREAM: profile-service:8080
      RECOMMENDATION_UPSTREAM: recommendation-service:8080
      AGENT_UPSTREAM: agent-service:8080
    depends_on:
      - auth-service
      - profile-service
      - recommendation-service
      - agent-service

  # ---------- Application services (Spring Boot) ----------
  auth-service:
    <<: *java-service
    build: ./services/auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/auth
      SPRING_DATASOURCE_USERNAME: auth_svc
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-120}
    depends_on:
      postgres-auth: { condition: service_healthy }

  profile-service:
    <<: *java-service
    build: ./services/profile-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-profile:5432/profile
      SPRING_DATASOURCE_USERNAME: profile_svc
      SPRING_DATASOURCE_PASSWORD: ${PROFILE_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres-profile: { condition: service_healthy }

  recommendation-service:
    <<: *java-service
    build: ./services/recommendation-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-movies:5432/movies
      SPRING_DATASOURCE_USERNAME: movies_svc
      SPRING_DATASOURCE_PASSWORD: ${MOVIES_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PROFILE_URL: http://profile-service:8080
      LLM_BASE_URL: http://llm:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:1.5b}
      # Interactive ("Ask AI"): past this the user gets the instant ranking instead of waiting.
      LLM_TIMEOUT_SECONDS: ${RECO_LLM_TIMEOUT_SECONDS:-30}
      LLM_INTERACTIVE_TIMEOUT_SECONDS: ${RECO_LLM_INTERACTIVE_TIMEOUT_SECONDS:-25}
    depends_on:
      postgres-movies: { condition: service_healthy }
      llm: { condition: service_healthy } # so it doesn't wait for the model to be fully downloaded

  agent-service:
    <<: *java-service
    build: ./services/agent-service
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      PROFILE_URL: http://profile-service:8080
      RECOMMENDATION_URL: http://recommendation-service:8080
      LLM_BASE_URL: http://llm:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:1.5b}
      # Background feed builds: nobody is waiting on them (the feed shows instant picks meanwhile).
      LLM_TIMEOUT_SECONDS: ${AGENT_LLM_TIMEOUT_SECONDS:-90}
      AGENT_INTERVAL_SECONDS: ${AGENT_INTERVAL_SECONDS:-120}
      FEED_TTL_HOURS: ${FEED_TTL_HOURS:-24}
    depends_on:
      redis: { condition: service_healthy }
      llm: { condition: service_healthy } # so it doesn't wait for the model to be fully downloaded

  # ---------- Data stores ----------
  # One Postgres server per service. The image creates POSTGRES_USER/POSTGRES_DB on first start,
  # so each service's role only exists on its own server.
  postgres-auth:
    <<: *postgres
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth_svc
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data

  postgres-profile:
    <<: *postgres
    environment:
      POSTGRES_DB: profile
      POSTGRES_USER: profile_svc
      POSTGRES_PASSWORD: ${PROFILE_DB_PASSWORD}
    volumes:
      - postgres-profile-data:/var/lib/postgresql/data

  postgres-movies:
    <<: *postgres
    environment:
      POSTGRES_DB: movies
      POSTGRES_USER: movies_svc
      POSTGRES_PASSWORD: ${MOVIES_DB_PASSWORD}
    volumes:
      - postgres-movies-data:/var/lib/postgresql/data

  # Agent's dedicated store (recommendation feed cache). AOF keeps it across restarts.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------- Inference engine ----------
  llm:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "24h"     # keep the model in memory: reloading it costs seconds on every cold request
      OLLAMA_NUM_PARALLEL: "2"     # a background feed build must not block an interactive "Ask AI" call
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    # Uncomment to call Ollama directly from your machine while developing prompts:
    # ports: ["11434:11434"]

  # One-shot job: downloads the model into the shared volume, then exits (fast on later runs).
  llm-init:
    image: ollama/ollama:latest
    restart: on-failure
    environment:
      OLLAMA_HOST: http://llm:11434
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-qwen2.5:1.5b}"]
    depends_on:
      llm: { condition: service_healthy }

  # ---------- Monitoring ----------
  # Prometheus scrapes /actuator/prometheus on every Spring service plus the exporters below.
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  postgres-auth-exporter:
    <<: *postgres-exporter
    network_mode: service:postgres-auth
    environment:
      DATA_SOURCE_URI: localhost:5432/auth?sslmode=disable
      DATA_SOURCE_USER: auth_svc
      DATA_SOURCE_PASS: ${AUTH_DB_PASSWORD}
    depends_on:
      postgres-auth: { condition: service_healthy }

  postgres-profile-exporter:
    <<: *postgres-exporter
    network_mode: service:postgres-profile
    environment:
      DATA_SOURCE_URI: localhost:5432/profile?sslmode=disable
      DATA_SOURCE_USER: profile_svc
      DATA_SOURCE_PASS: ${PROFILE_DB_PASSWORD}
    depends_on:
      postgres-profile: { condition: service_healthy }

  postgres-movies-exporter:
    <<: *postgres-exporter
    network_mode: service:postgres-movies
    environment:
      DATA_SOURCE_URI: localhost:5432/movies?sslmode=disable
      DATA_SOURCE_USER: movies_svc
      DATA_SOURCE_PASS: ${MOVIES_DB_PASSWORD}
    depends_on:
      postgres-movies: { condition: service_healthy }

  redis-exporter:
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis: { condition: service_healthy }

  # Datasource and the "PSIA Movie Hub" dashboard are provisioned from infra/monitoring/grafana/.
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/psia.json
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  postgres-auth-data:
  postgres-profile-data:
  postgres-movies-data:
  redis-data:
  ollama-models:
  prometheus-data:
  grafana-data:
