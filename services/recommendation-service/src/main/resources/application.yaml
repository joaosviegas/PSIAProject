# MERGE NOTE: recommendation-service already has an application.yaml with at
# least datasource/flyway/actuator/jwt.secret configured (implied by
# PingController, SecurityConfig.java, and V1__init.sql already existing).
# Add only the two blocks below — don't touch jwt.secret, it's already wired.

spring:
  ai:
    ollama:
      base-url: ${LLM_BASE_URL}
      chat:
        options:
          model: ${LLM_MODEL:qwen2.5:1.5b}
          # Short, steady answers: the reply is ~5 titles + one sentence, so cap generation
          # (on CPU, generated tokens dominate latency) and keep the sampling tight.
          num-predict: ${LLM_NUM_PREDICT:200}
          temperature: ${LLM_TEMPERATURE:0.3}
      init:
        # compose.yaml's llm-init job already pulls the model into the
        # shared volume before this service starts; don't pull again here.
        pull-model-strategy: never

# Used by ProfileClient to (optionally) enrich the AI prompt with the
# caller's profile — see NOTES.md for the assumed contract.
profile:
  base-url: ${PROFILE_URL}

# Read by OllamaTimeoutConfig (best-effort — see that class's javadoc).
llm:
  timeout-seconds: ${LLM_TIMEOUT_SECONDS:30}
  # Hard ceiling enforced by LlmClient, independent of the HTTP client's read timeout.
  interactive-timeout-seconds: ${LLM_INTERACTIVE_TIMEOUT_SECONDS:25}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
